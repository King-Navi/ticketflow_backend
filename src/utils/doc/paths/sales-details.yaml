get:
  tags: [Sales]
  operationId: getTicketSalesDetail
  summary: Detalle de ventas por ticket
  description: |
    Devuelve el detalle por ticket (una fila por ticket vendido), filtrable por compañía y rango de fechas.
    Requiere autenticación y rol ORGANIZER o ADMIN.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: companyId
      required: true
      schema:
        type: integer
        minimum: 1
      description: ID de la compañía.
      example: 1

    - in: query
      name: startDate
      required: false
      schema:
        type: string
        format: date
      description: Fecha inicial (YYYY-MM-DD).
      example: "2026-01-01"

    - in: query
      name: endDate
      required: false
      schema:
        type: string
        format: date
      description: Fecha final (YYYY-MM-DD).
      example: "2026-01-31"

  responses:
    "200":
      description: Detalle obtenido correctamente
      content:
        application/json:
          schema:
            $ref: "../schemas/sales.yaml#/TicketSalesDetailEnvelope"
          examples:
            ejemplo:
              value:
                message: "Ticket sales detail fetched successfully."
                count: 1
                data:
                  - company_id: 1
                    organizacion: "Mi Empresa"
                    event_id: 10
                    evento: "Concierto X"
                    fecha_evento: "2026-01-15"
                    ticket_id: 501
                    precio_pagado: "450.00"
                    precio_original: "500.00"
                    zona: "VIP"
                    fila: "A"
                    asiento: "12"
                    estado_ticket: "sold"
                    fecha_venta: "2026-01-02T12:34:56.000Z"

    "400":
      description: Error de validación (query inválido)
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/Error"
          examples:
            companyId_invalido:
              value: { message: "companyId must be a positive integer." }
            fechas_invertidas:
              value: { message: "startDate must be less than or equal to endDate." }

    "401":
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/Error"
          examples:
            no_token:
              value: { message: "Unauthorized" }

    "403":
      description: No autorizado (rol insuficiente)
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/Error"
          examples:
            forbidden:
              value: { message: "Forbidden" }

    "500":
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "../schemas/common.yaml#/Error"
          examples:
            error:
              value: { message: "Error fetching ticket sales detail." }
