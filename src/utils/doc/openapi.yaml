openapi: 3.1.0
info:
  title: Mi API
  version: 1.0.0
  description: API de ejemplo para TicketFlow
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

servers:
  - url: http://localhost:6970
    description: Desarrollo

security:
  - bearerAuth: []

paths:
  /v1/auth/password/forgot:
    $ref: "./paths/auth-password-forgot.yaml"
  /v1/auth/password/reset/validate:
    $ref: "./paths/auth-password-reset-validate.yaml"
  /v1/auth/password/reset:
    $ref: "./paths/auth-password-reset.yaml"
  /v1/login:
    $ref: "./paths/auth-login.yaml"
  /v1/user/register:
    $ref: "./paths/auth-register.scheme.yaml"
  /v1/company/:companyId/events:
    $ref: "./paths/company-events.yaml"
  /v1/event/new:
    $ref: "./paths/events-create.yaml"
  /v1/event/search:
    $ref: "./paths/events-search.yaml"
  /v1/event/edit/:eventId:
    $ref: "./paths/events-edit.yaml"
  /v1/event/img/:eventId/new:
    $ref: "./paths/event-upload-image.yaml"
  /v1/event/:eventId/status:
    $ref: "./paths/event-update-status.yaml"
  /v1/event/img/:eventId/images:
    $ref: "./paths/event-img-getall-by-id.yaml"
  /v1/eventseats/with-event:
    $ref: "./paths/eventseats-with-event.yaml"
  /v1/eventseats/:eventId/seats:
    $ref: "./paths/events-seats-by-event.yaml"
  /v1/location/search/all:
    $ref: "./paths/location-search-all.yaml"
  /v1/location/:eventLocationId/layout:
    $ref: "./paths/location-layout.yaml"
  /v1/organizer/edit:
    $ref: "./paths/organizer-update.yaml"
  /v1/organizer/me:
    $ref: "./paths/organizer-me.yaml"
  /v1/report/sales:
    $ref: "./paths/sales-report.yaml"
  /v1/report/sales/details:
    $ref: "./paths/sales-details.yaml"
  /v1/reservations/reserve:
    $ref: "./paths/reservations-create.yaml"
  /v1/ticket/buy :
    $ref: "./paths/tickets-buy.yaml"
  /v1/ticket/check-in :
    $ref: "./paths/tickets-check-in.yaml"
  /v1/ticket/my-event:
    $ref: "./paths/tickets-my-event.yaml"
  /v1/ticket/{ticketId}/qr: 
    $ref: "./paths/tickets-qr.yaml"
  /v1/ticket/:ticketId/refund:
    $ref: "./paths/ticket-refund.yaml"
  
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      $ref: "./schemas/auth.yaml#/LoginRequest"
    LoginResponse:
      $ref: "./schemas/auth.yaml#/LoginResponse"
    Error:
      $ref: "./schemas/common.yaml#/Error"

    Event:
      $ref: "./schemas/event.yaml#/Event"
    EventCreateRequest:
      $ref: "./schemas/event.yaml#/EventCreateRequest"
    EventListResponse:
      $ref: "./schemas/event.yaml#/EventListResponse"

    EventLocation:
      $ref: "./schemas/event-location.scheme.yaml#/EventLocation"

    OrganizerBasicInfoResponse:
      $ref: "./schemas/organizer.yaml#/OrganizerBasicInfoResponse"
    UpdateOrganizerRequest:
      $ref: "./schemas/organizer.yaml#/UpdateOrganizerRequest"
    UpdateOrganizerResponse:
      $ref: "./schemas/organizer.yaml#/UpdateOrganizerResponse"

    EventLocationFullLayoutResponse:
      $ref: "./schemas/event-location-layout.scheme.yaml#/EventLocationFullLayoutResponse"
    EventLocationAddress:
      $ref: "./schemas/event-location-layout.scheme.yaml#/EventLocationAddress"
    EventLocationSection:
      $ref: "./schemas/event-location-layout.scheme.yaml#/EventLocationSection"
    EventLocationSeat:
      $ref: "./schemas/event-location-layout.scheme.yaml#/EventLocationSeat"

    EventWithInventoryCreateRequest:
      $ref: "./schemas/event-seats.scheme.yaml#/EventWithInventoryCreateRequest"
    EventWithInventoryCreateResponse:
      $ref: "./schemas/event-seats.scheme.yaml#/EventWithInventoryCreateResponse"
    EventPayload:
      $ref: "./schemas/event-seats.scheme.yaml#/EventPayload"
    InventoryItem:
      $ref: "./schemas/event-seats.scheme.yaml#/InventoryItem"
    InventoryCreatedItem:
      $ref: "./schemas/event-seats.scheme.yaml#/InventoryCreatedItem"
    Counts:
      $ref: "./schemas/event-seats.scheme.yaml#/Counts"

    RegisterRequest:
      $ref: "./schemas/auth-register.scheme.yaml#/RegisterRequest"
    RegisterEnvelope:
      $ref: "./schemas/auth-register.scheme.yaml#/RegisterEnvelope"
    RegisterResult:
      $ref: "./schemas/auth-register.scheme.yaml#/RegisterResult"

    EventImageUploadResponse:
      $ref: "./schemas/event-image.yaml#/EventImageUploadResponse"

    PasswordForgotRequest:
      $ref: "./schemas/auth-password.yaml#/PasswordForgotRequest"

    OrganizationSalesReportEnvelope:
      $ref: "./schemas/sales.yaml#/OrganizationSalesReportEnvelope"
    OrganizationSalesReportItem:
      $ref: "./schemas/sales.yaml#/OrganizationSalesReportItem"

    TicketSalesDetailEnvelope:
      $ref: "./schemas/sales.yaml#/TicketSalesDetailEnvelope"
    TicketSalesDetailItem:
      $ref: "./schemas/sales.yaml#/TicketSalesDetailItem"